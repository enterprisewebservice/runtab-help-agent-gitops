
# Gateway for the runtab-help team, founded by runtab-help.
#
# Declared HERE, in the agent's own gitops repo — NOT minted by the
# operator — so the gateway is a first-class, declarative resource that's
# reversible by deleting it. The AgentWorkstation's
# runtime.shared.gatewayRef points at this gateway by name.
#
# Nobody "owns" this via ownerReferences: its lifecycle is git/ArgoCD.
# Pruning this repo removes BOTH the agent and this gateway (the
# AgentGateway controller cascades its own Pod / PVC / Service / Route).
#
# A new team starts as "a gateway with one agent" — point another
# AgentWorkstation's gatewayRef at "runtab-help" and it
# joins this same gateway pod. The operator treats that identically to
# any shared agent; there is no dedicated-vs-shared code path.
#
# namespace + commonLabels are applied by base/kustomization.yaml.
apiVersion: agentoffice.ai/v1alpha1
kind: AgentGateway
metadata:
  # Named for the TEAM, not the founding agent, so the second agent to
  # arrive reads as a colleague rather than a guest in someone's gateway.
  name: runtab-help
spec:
  displayName: Runtab help desk
  description: "Dedicated gateway for agent runtab-help"
  # OpenClaw runtime image: 2026.10.33 (extended-stable) since 20 Nov 2026, a
  # byte-identical copy of ghcr.io/openclaw/openclaw:2026.10.33 (linux/amd64
  # digest sha256:537c50c4a488...) in the cluster's Quay. It ran v2026.7.1 before.
  # Needs agent-office-operator >= v1.7.86 (keyed agent roster, gateway-owned
  # sign-in store).
  #
  # GOING BACK IS NOT AN IMAGE CHANGE. From 2026.9.9 the image repairs and
  # migrates the state on the volume at every start (`openclaw doctor --fix`),
  # and the old image cannot read the migrated state. The way back is the
  # volume as it was before the switch: VolumeSnapshot
  # runtab-help-workspace-pre-openclaw-20261120 in agent-office (taken with the
  # gateway stopped). Stop the gateway (`suspend: true` here), replace the
  # volume claim runtab-help-workspace from that snapshot, set v2026.7.1 here,
  # remove `suspend`.
  #
  # base/agentworkstation.yaml names an image too; the operator reads only this one.
  image: quay-quay-quay-test.apps.salamander.aimlworkbench.com/deanpeterson/openclaw:v2026.10.33
  # Codex-backed agent with its own sign-in: runtab-help-codex-credentials is
  # synced by ESO from Vault agent-office/codex/runtab-help (agent-office
  # cluster/secrets/codex-gateway-credentials.yaml). Never share one sign-in
  # between gateways: Codex refresh tokens are single-use, so two holders cut
  # each other off. The agent never sees raw credentials.
  codexCredentialsSecretRef: runtab-help-codex-credentials
  # The real browser. Convention: a node-host on the KubeVirt VM dials this
  # gateway with display name fedora-black-zebra-36-<gateway>; the operator
  # auto-approves the pairing request whose display name contains
  # nodeHostRef.name. Start it on the VM as
  #   openclaw-nodehost-<gateway>.service (clone the newsroom unit; token
  #   from Secret <gateway>-token). Without a paired node-host, agents can
  # web_fetch HTML shells but cannot render React sites like redhat.com.
  # Bill turns to the subscription, never a metered API key.
  #
  # OpenClaw 2026.7.x folded provider `openai-codex` into canonical
  # `openai`, so one gateway config can describe only ONE OpenAI route.
  # Without this the operator has to infer the route, and OpenClaw
  # resolves the credential implicitly — which is how agent traffic
  # silently landed on per-token billing. mode: subscription makes the
  # operator render chatgpt.com/backend-api, omit apiKey entirely, and
  # pin auth.order to the OAuth profile.
  #
  # Requires agent-office-operator >= v1.7.6. (The operator would infer
  # `subscription` from codexCredentialsSecretRef above, but stating it
  # keeps the billing route readable in git.)
  modelAuth:
    mode: subscription
    # The models this gateway lists on the subscription route (19 Nov 2026).
    # Without this the operator lists its built-in set (gpt-5.6-sol, gpt-5.6,
    # gpt-5.5, gpt-5.4); OpenAI has retired the last two from ChatGPT sign-in.
    # gpt-6.2-sol is what the agent runs on. OpenClaw 2026.7.1 does not know
    # that model yet: it passes the id through to OpenAI (proven by a test
    # turn) and lists it as text-only with a 200k context, which is enough for
    # this text help desk. gpt-5.6-sol stays listed as the way back: put it
    # back in base/agentworkstation.yaml and the agent runs on it again.
    # A model id OpenAI does not know pauses every agent on the gateway
    # (provider cooldown), so prove a new id with a test turn before it goes
    # in here:  openclaw agent --agent <id> --model openai/<model> ...
    models:
      - id: gpt-6.2-sol
        name: GPT-6.2 Sol
      - id: gpt-5.6-sol
        name: GPT-5.6 Sol
  # The Runtab backend's help page talks to this agent through the gateway's
  # OpenAI-compatible endpoint (/v1/chat/completions), authenticated by the
  # gateway token, which only the backend's ServiceAccount may read
  # (Role runtab-help-gateway-token-reader in agent-office).
  http:
    chatCompletions: true
  # The Runtab Discord server (19 Nov 2026). Secret runtab-help-discord holds one
  # key, DISCORD_BOT_TOKEN: the token of the Discord application "Runtab Help"
  # (id 1573102786315558912), created by Dean from his clipboard, never in git.
  # The operator passes the Secret to the gateway pod as environment variables.
  # The Discord settings themselves (which server and channels, no direct
  # messages, the public persona and its three tools) are set BY HAND in the
  # gateway's openclaw.json on its volume, because the operator has no Discord
  # block for a gateway yet. What was applied is recorded in the Runtab repo:
  # deploy/runtab/discord-helper/.
  envFromSecretRef: runtab-help-discord

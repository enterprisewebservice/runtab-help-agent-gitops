# The Runtab help desk's own identity at the platform's tool gateway (the Connectivity Link
# MCP gateway). Authorino matches the bearer the gateway pod presents against Secrets that carry
# the label agentoffice.ai/mcp-gateway-caller; the annotation agentoffice.ai/mcp-servers names
# the ONLY tool server this key may call. A call to any other server is refused at the gateway
# (AuthPolicy mcp-gateway-tool-access), whatever the agent was talked into.
#
# Until 20 Nov 2026 this desk presented the platform's GitHub App token, which the gateway
# accepts for every registered tool server (GitHub and Gitea write tools, the newsroom, the CRM,
# the workshop seats).
#
# No agentoffice.ai/mcp-namespace annotation, on purpose: that annotation allows every server
# registered in the named namespace, and all the platform's servers are registered in agent-office.
#
# The key is GENERATED by External Secrets (Password generator): never typed, never in git or a
# chat. refreshInterval "0" = generated once; it does not rotate on a timer. (The GitHub App
# token did, every 30 minutes, and each rotation made the operator rewrite this gateway's
# openclaw.json, which drops the tools of a conversation in flight.)
#
# One key for the whole gateway pod: the Discord persona runtab-community lives on this gateway
# too, and its two product tools (runtab_knowledge, runtab_release) are on this same server.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: runtab-help-mcp-caller-key
spec:
  length: 48
  digits: 10
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: runtab-help-mcp-caller
spec:
  refreshInterval: "0"
  target:
    name: runtab-help-mcp-caller
    creationPolicy: Owner
    template:
      metadata:
        labels:
          agentoffice.ai/mcp-gateway-caller: "true"
          authorino.kuadrant.io/managed-by: authorino
        annotations:
          agentoffice.ai/mcp-caller: runtab-help
          agentoffice.ai/mcp-servers: "agent-office/runtab-support"
      data:
        # api_key is the name Authorino reads; MCP_CALLER_KEY is the name the workstation's
        # header refers to (agentworkstation.yaml, tools.mcpServers[governed]).
        api_key: "{{ .password }}"
        MCP_CALLER_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: runtab-help-mcp-caller-key
